services:
  stt_server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build the diarization backend into the image: DIARIZE=true docker compose up --build
        DIARIZE: "${DIARIZE:-false}"
    image: stt_server_gpu
    pull_policy: build
    container_name: stt_server
    hostname: stt_server
    restart: unless-stopped
    networks:
      - stt_network
    env_file:
      - .env
    environment:
      TZ: America/New_York
      STT_HOST: "0.0.0.0"
      STT_PORT: "${STT_PORT:-5099}"
      STT_POOL_SIZE: "1"
      STT_DEBUG: "false"
      MAX_CONTENT_LENGTH_MB: "10"
      CORS_ORIGINS: "*"
      GUNICORN_WORKERS: "4"
      WHISPER_DOWNLOAD_ROOT: "/opt/models"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      # Force CUDA backend.
      COMPUTE_TYPE: "cuda"
      # Speaker diarization. Switching this on needs an image built with DIARIZE=true;
      # otherwise the model is simply not installed and /api/diarize answers 503.
      DIARIZE_ENABLED: "${DIARIZE:-false}"
      DIARIZE_POOL_SIZE: "1"
    ports:
      - "${STT_PORT:-5099}:${STT_PORT:-5099}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./stt_server.py:/opt/stt_server.py:ro
      - ./stt_client.py:/opt/stt_client.py:ro
      - ./gu.py:/opt/gu.py:ro
      - ./libs:/opt/libs:ro
      - ./models:/opt/models
      - ./logs:/opt/logs
      - ./recs:/opt/recs
    # GPU passthrough via CDI. Requires a CDI spec on the host:
    #   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    # (nvidia-container-toolkit >= 1.14; regenerate after a driver update).
    #
    # Preferred over deploy.resources.reservations.devices: with that form a
    # `systemctl daemon-reload` silently revokes the container's access to the
    # nvidia device nodes on cgroup v2. The container keeps running and looks
    # healthy, but nvidia-smi inside reports "Failed to initialize NVML" and
    # CUDA calls start failing with misleading cuDNN/cuBLAS errors.
    devices:
      - "nvidia.com/gpu=all"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "3"
    entrypoint: ["/opt/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${STT_PORT:-5099}/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command:
      - "python3 stt_server.py"
      # - "gunicorn --config gu.py stt_server:app"

networks:
  stt_network:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.enable_ipv6: "false"

